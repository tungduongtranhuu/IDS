# Shared variables, usable in every rule file as "$NAME".
# A list variable used inside a list is expanded in place:
#   ports: [$HTTP_PORTS, 9000]  ->  [80, 3000, 8000, 8080, 8888, 9000]

vars:
  # Ports where the lab web apps listen (DVWA :80, Juice Shop :3000, ...).
  HTTP_PORTS: [80, 3000, 8000, 8080, 8888]
  DNS_PORTS: [53]
